name: Configure private Supabase monitor credentials
on: workflow_dispatch
permissions:
  contents: read
jobs:
  configure:
    if: github.ref == 'refs/heads/main' && github.event.repository.private == true
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Transfer existing credentials directly to Supabase Vault
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          INTIGRITI_TOKEN: ${{ secrets.INTIGRITI_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PHINIX_SITE_URL: ${{ vars.PHINIX_SITE_URL }}
          PHINIX_SITE_TOKEN: ${{ secrets.PHINIX_SITE_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, sys
          args = {'intigriti':os.environ['INTIGRITI_TOKEN'],'discord':os.environ['DISCORD_WEBHOOK_URL'],
                  'site_url':os.environ.get('PHINIX_SITE_URL',''),'site_token':os.environ.get('PHINIX_SITE_TOKEN','')}
          request = urllib.request.Request(os.environ['SUPABASE_URL']+'/rest/v1/rpc/phinix_edge_rpc',
              data=json.dumps({'op':'configure','args':args}).encode(),
              headers={'apikey':os.environ['SUPABASE_SECRET_KEY'],'Content-Type':'application/json'})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result=json.load(response)
              if result != {'configured':True}: raise ValueError()
          except Exception:
              print('Credential transfer failed; no secret values were logged.')
              sys.exit(1)
          print('Supabase Vault configured successfully.')
          PY
