name: Validate Phinix
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '**.mmd']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock
      - run: ruff check .
      - run: ruff format --check .
      - run: node --test tests/edge.test.mjs
      - run: pytest -q --cov=app --cov-fail-under=85
      - run: docker build -t phinix-monitor:test .
