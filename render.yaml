# Free viewer. Durable state lives in Supabase; GitHub Actions polls Intigriti.
services:
  - type: web
    name: phinix-monitor
    runtime: python
    plan: free
    region: singapore
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: APP_ENV
        value: production
      - key: SNAPSHOT_MODE
        value: 'true'
      - key: SUPABASE_SNAPSHOT
        value: 'true'
      - key: INTIGRITI_DOMAINS_ONLY
        value: 'true'
      - key: DATABASE_PATH
        value: /tmp/phinix/placeholder.db
      - key: ADMIN_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
